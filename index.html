DET.length=0;DET.push(['interview',/면접/],['cover',/자기소개서|자소서|경험|뭘 써|무엇을 써|쓸 내용/],['notice',/공고|우대|지원 조건|지원조건|자격|용어/],['find',/일자리|구직|어디서|어디에서|찾아|찾기/],['job',/어떤 일|무슨 일|적성|맞는 일|직무|하고 싶|좋아하는|할지 모르|뭘 해야|무엇을 해야/]);
EXS.length=0;EXS.push('어디서 일자리를 찾아야 할지 모르겠어요.','어떤 일을 해야 할지 모르겠어요.','채용 공고의 말이 너무 어려워요.','자기소개서에 뭘 써야 할지 모르겠어요.','면접 질문이 걱정돼요.');
const NAVF={cover:()=>{tab='p';S=[{v:'p0'},{v:'pcl'}]},interview:()=>{tab='p';S=[{v:'p0'},{v:'pint'}];IV={i:-1}},docs:()=>{tab='u';S=[{v:'u0'},{v:'udoc0'}]},jobs:()=>{tab='k';S=[{v:'k0'},{v:'kjob'}]}};
jGo=function(i){NAVF[SC[J.sc].go[i][1]]();draw()};
const _uj=V.ujob;V.ujob=()=>{const s=J.s;
if(s==='pick')return bar(0)+`<h2>어떤 고민에 가까워요?</h2><p class="sub">내가 쓴 말: ${E(J.t)}</p>${Object.keys(SC).map(k=>`<button class="opt" onclick="jP('${k}')">${SC[k].n}</button>`).join('')}`;
if(s!=='res')return _uj();
const sc=SC[J.sc],a=J.a,ch=[...new Set([...sc.bc,...a.map(x=>x.c).filter(Boolean)])],ac=[...new Set([...a.map(x=>x.a).filter(Boolean),...sc.ba])];
return bar(100)+`<h2>정리했어요 ✨</h2>${DEMO2}<div class="card blk"><h4>① 지금 고민하는 점</h4>${E(J.t)}</div><div class="card blk"><h4>② 함께 확인한 내용</h4>${a.map((x,i)=>`• ${sc.qs[i][0]}<br><b>${E(x.t)}</b>`).join('<br>')}</div><div class="card blk"><h4>③ 알아보면 좋은 정보</h4>${ch.map(x=>'• '+E(x)).join('<br>')}</div><div class="card blk"><h4>④ 이렇게 준비해 보세요</h4>${ck('j'+J.sc+a.map(x=>x.i).join(''),ac)}</div><div class="card blk"><h4>⑤ 다음에 해볼 수 있는 활동</h4>${sc.nx.map(x=>'• '+x).join('<br>')}</div><h3>⑥ 이해도 확인</h3>${quiz('jq'+J.sc,sc.qz)}<div class="note">나에게 꼭 맞는 일이나 정답을 AI가 정해 주지 않아요. 알아보고 고르는 것은 내가 해요.</div>${sc.go.map((g,i)=>`<button class="big${i?' o':''}" onclick="jGo(${i})">${g[0]} →</button>`).join('')}<button class="big o" onclick="J.s=1;draw()">답변 고치기</button><button class="big o" onclick="J={t:'',sc:null,a:[],s:0};draw()">다른 이야기 하기</button>`};
V.intro=()=>`<div class="intro" style="min-height:100%;display:flex;flex-direction:column;padding-top:0"><div style="flex:1;display:flex;flex-direction:column;justify-content:center;padding-bottom:12px"><svg width="120" height="70" viewBox="0 0 120 70" role="img" aria-label="줄넘기 로고" style="margin:0 auto"><path d="M6 62C18 40 40 18 62 24C80 30 78 52 58 56C38 58 34 34 52 22C70 10 96 8 112 8" fill="none" stroke="#2f80ed" stroke-width="7" stroke-linecap="round"/><path d="M6 62C18 40 40 18 62 24C80 30 78 52 58 56C38 58 34 34 52 22C70 10 96 8 112 8" fill="none" stroke="#9cc9ff" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 5"/></svg><h1 style="font-size:26px;margin:22px 0 14px">줄넘기</h1><p class="slo" style="font-size:19px;margin:0 0 14px">취업 준비, 한 걸음씩 함께해요</p><p class="sub" style="margin:0 0 24px">어려운 취업 정보를 쉽게 이해하고, 직접 연습하며<br>나에게 맞는 일자리를 찾아봐요.</p></div><button class="big" onclick="root('u')">줄넘기 시작하기</button><button class="big o" style="margin-top:0" onclick="enterSM()">서비스 체험해 보기</button></div>`;
/* ===== v4: 시나리오 체험 모드 / 캡처 모드 ===== */
let SM={on:false,step:0,cap:false};
const SMN=['공고 이해','자기소개서','모의 면접','정보 탐색','경험 나눔'];
const AP={cl:['사무보조','편의점 알바','꼼꼼함','정리하는 일에 관심이 있어요'],iv:{0:'저는 김○○입니다. 정리하는 일에 관심이 있어 지원했습니다.',1:'정리하는 일을 좋아하고, 편의점 알바에서 물건을 정리한 경험이 있어서 지원했습니다. 열심히 배우겠습니다.',2:'모르는 것이 생기면 먼저 스스로 찾아보고, 그래도 어려우면 선배에게 질문하겠습니다. 들은 내용은 메모해서 정확하게 하겠습니다.'}};
const T=(t,v,p)=>{tab=t;S=[{v:t+'0'}].concat(v?[{v,p:p||{}}]:[])};
const pidx=()=>Math.max(0,POS.findIndex(q=>q.t==='면접 후기'));
function seedC(){const x=POS[pidx()];if(x&&x.cm.length===0){x.cm.push('저도 면접이 무서웠는데 연습하니까 괜찮았어요.','모르는 질문은 다시 물어봐도 된다는 말이 도움이 됐어요.');sv('posts',POS)}}
const ivf=i=>({t:AP.iv[i],r:EL[i].map(e=>[e[0],e[1].test(AP.iv[i])])});
const CAPS=[['① 이해하기 메뉴',1,()=>T('u')],['② 채용 공고 핵심 정보',1,()=>T('u','udoc',{k:'job0',part:'a'})],['③ 쉬운 용어·체크리스트',1,()=>{sv('ck_djob0',[0,1]);T('u','udoc',{k:'job0',part:'b'})}],['④ 자기소개서 질문',2,()=>{CL={s:0,a:[...AP.cl],out:null};T('p','pcl')}],['⑤ 자기소개서 결과',2,()=>{CL={s:4,a:[...AP.cl],out:null};T('p','pcl')}],['⑥ 모의 면접 질문',3,()=>{IV={i:0,f:null,d:{...AP.iv}};T('p','pint')}],['⑦ 면접 답변 피드백',3,()=>{IV={i:0,d:{...AP.iv},f:ivf(0)};T('p','pint')}],['⑧ 취업·지원 정보 목록',4,()=>T('k','ksup')],['⑨ 지원 제도 상세',4,()=>T('k','ksupd',{i:0})],['⑩ 경험 나눔 게시판',5,()=>T('k','kbd')],['⑪ 게시글 상세·댓글',5,()=>{seedC();T('k','kpost',{i:pidx()})}]];
const STEPS={0:()=>{tab='u';S=[{v:'sintro'}]},1:()=>T('u'),2:()=>{CL={s:-1,a:[...AP.cl],out:null};T('p','pcl')},3:()=>{IV={i:-1,d:{...AP.iv}};T('p','pint')},4:()=>T('k'),5:()=>{seedC();T('k','kbd')},6:()=>{tab='u';S=[{v:'sdone'}]}};
function goStep(n){n=Math.max(0,Math.min(6,n));SM.step=n;STEPS[n]();draw()}
function capGo(v){if(v==='')return;const c=CAPS[+v];SM.step=c[1];c[2]();draw();if(+v===2){try{ans('djob0',1)}catch(e){}}}
function enterSM(){SM={on:true,step:0,cap:false};CL={s:-1,a:[]};IV={i:-1};J={t:'',sc:null,a:[],s:0};goStep(0)}
function exitSM(){SM={on:false,step:0,cap:false};$('app').classList.remove('cap');sv('ck_djob0',[]);CL={s:-1,a:[]};IV={i:-1};J={t:'',sc:null,a:[],s:0};root('u')}
function capOn(){SM.cap=true;$('app').classList.add('cap');draw(true);toast('Esc 키 또는 상단 바 더블클릭으로 캡처 모드 종료')}
function capOff(){SM.cap=false;$('app').classList.remove('cap');draw(true)}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&SM.cap)capOff()});$('top').ondblclick=()=>{if(SM.cap)capOff()};
const toCL=()=>SM.on?goStep(2):(tab='p',S=[{v:'p0'},{v:'pcl'}],draw());
const toIV=()=>SM.on?goStep(3):(IV={i:-1},go('pint'));
const toInfo=()=>SM.on?goStep(4):root('k');
const toBoard=()=>SM.on?goStep(5):go('kbd');
const sbe=document.createElement('div');sbe.id='sbar';sbe.hidden=true;$('top').after(sbe);
function sb(){const e=$('sbar'),s=SM.step;if(!SM.on||SM.cap){e.hidden=true;return}e.hidden=false;e.innerHTML=`<div><b>시연 모드</b> · A씨 · ${s>=1&&s<=5?`STEP ${s}/5 ${SMN[s-1]}`:s===0?'소개':'완료'}</div><div class="dots">${SMN.map((n,i)=>`<button class="${s===i+1?'on':''}" aria-label="STEP ${i+1} ${n}" onclick="goStep(${i+1})">${i+1}</button>`).join('')}</div><div class="row2"><button class="sb" onclick="goStep(SM.step-1)" ${s<=0?'disabled':''}>‹ 이전 단계</button><button class="sb" onclick="goStep(SM.step+1)" ${s>=6?'disabled':''}>다음 단계 ›</button></div><div class="row2"><select aria-label="캡처용 화면" onchange="capGo(this.value)"><option value="">캡처용 화면 선택</option>${CAPS.map((c,i)=>`<option value="${i}">${c[0]}</option>`).join('')}</select><button class="sb" onclick="capOn()">캡처 모드</button><button class="sb" onclick="exitSM()">일반 모드</button></div><div class="smn">화면의 내용은 예시 데이터예요. 실제 AI 분석이 아니에요.</div>`}
const _d4=draw;draw=function(k){_d4(k);sb()};
V.sintro=()=>`<h2>A씨의 취업 준비</h2><div class="card">👤 20대 A씨는 경제적으로 자립하기 위해 처음 취업을 준비해요.</div><div class="card">😟 채용 공고가 어렵고, 자기소개서와 면접이 막막해요.</div><div class="card">🎯 목표: 사무보조 일에 지원하기</div><h3>줄넘기와 함께하는 5단계</h3><div class="card">1. 이해하기 – 채용 공고 이해<br>2. 연습하기 – 자기소개서 작성<br>3. 연습하기 – 모의 면접<br>4. 활용하기 – 취업 정보·지원 제도<br>5. 활용하기 – 경험 나눔</div><button class="big" onclick="goStep(1)">체험 시작하기 →</button><button class="big o" onclick="exitSM()">일반 모드로 돌아가기</button><p class="sm">아래 화면의 내용은 모두 예시 데이터예요.</p>`;
V.sdone=()=>`<h2>체험을 마쳤어요 🎉</h2><div class="card">A씨는 이해 → 연습 → 활용 순서로 취업을 준비했어요.</div>${SMN.map((n,i)=>`<button class="opt" onclick="goStep(${i+1})">STEP ${i+1}. ${n} 다시 보기</button>`).join('')}<button class="big" onclick="exitSM()">일반 모드로 돌아가기</button>`;
const _u3=V.udoc;V.udoc=p=>{let h=_u3(p);const i=h.indexOf('<h3>어려운 말 풀이</h3>');if(p.part&&i>0){const t=h.match(/<h2>.*?<\/h2>/)[0];h=p.part==='a'?h.slice(0,i)+`<button class="big" onclick="go('udoc',{k:'${p.k}',part:'b'})">쉬운 말 풀이 보기 →</button>`:t+h.slice(i)}if(/^job\d$/.test(p.k||'')&&p.part!=='a')h+=`<button class="big" onclick="toCL()">자기소개서 작성 연습하기 →</button>`;return h};
const _pc=V.pcl;V.pcl=()=>_pc().replace("IV={i:-1};go('pint')",'toIV()').replace('면접 연습하러 가기','면접 연습하기 →');
const _pi=V.pint;V.pint=()=>{let h=_pi();if(IV.i>=IQ.length)h=h.replace(`<button class="big o" onclick="root('k')">활용 탭 보기</button>`,`<button class="big" onclick="toInfo()">취업 정보 확인하기 →</button>`);return h};
const _ks=V.ksup;V.ksup=()=>_ks()+`<button class="big o" onclick="go('kjob')">채용 공고(취업 정보) 보기</button>`;
const _kj2=V.kjob;V.kjob=()=>_kj2()+`<button class="big o" onclick="go('ksup')">지원 제도(지원 정보) 보기</button>`;
const _kd=V.ksupd;V.ksupd=p=>_kd(p)+`<button class="big o" onclick="toBoard()">다른 사람의 경험 살펴보기 →</button>`;
const _kb=V.kbd;V.kbd=()=>_kb().replace('✏️ 글 쓰기','✏️ 나도 경험 공유하기');
const _kp=V.kpost;V.kpost=p=>_kp(p).replace('<span class="pill">','<span class="tag" style="background:var(--mt)">👤 이용자 경험담 · 공식 정보 아님</span><br><span class="pill">');
draw();
